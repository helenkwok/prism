name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history and tags: the name guard scans commit messages and tag messages,
      # and the protocol-order guard compares commit order against the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Hooks can be skipped locally, so these run again here and are authoritative.
      - name: Forbidden paths (every tracked file)
        run: node scripts/check-forbidden-paths.mjs --tracked
      - name: Name guard (files, commit history, tags)
        run: node scripts/check-agent-names.mjs
      - name: Protocol order guard
        run: node scripts/check-protocol-order.mjs
      - name: Spike record lint
        run: node scripts/check-spike-records.mjs
      - name: Vendored gate matches its pin (offline)
        run: node scripts/verify-vendor.mjs

      - name: Data dir guard accepts a path outside the workspace
        run: PRISM_DATA_DIR="$RUNNER_TEMP/prism-data" node scripts/check-data-dir.mjs
      - name: Data dir guard rejects a path inside the workspace
        run: |
          rc=0
          PRISM_DATA_DIR="$GITHUB_WORKSPACE/data" node scripts/check-data-dir.mjs || rc=$?
          echo "guard exit status: $rc"
          [ "$rc" -eq 1 ]
      - name: Data dir guard rejects a symlink that points into the workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/data"
          ln -s "$GITHUB_WORKSPACE/data" "$RUNNER_TEMP/prism-link"
          rc=0
          PRISM_DATA_DIR="$RUNNER_TEMP/prism-link" node scripts/check-data-dir.mjs || rc=$?
          echo "guard exit status: $rc"
          [ "$rc" -eq 1 ]
      - name: Data dir guard rejects a relative path
        run: |
          rc=0
          PRISM_DATA_DIR="data" node scripts/check-data-dir.mjs || rc=$?
          echo "guard exit status: $rc"
          [ "$rc" -eq 2 ]

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the pinned gate requirements into an isolated environment
        run: |
          python -m venv .venv-gate
          .venv-gate/bin/pip install --require-virtualenv -r vendor/ai-output-to-value/requirements-claim-gate.txt
      - name: Gate tests through the pinned jsonschema
        run: npm run test:gate

  vendor-remote:
    name: vendor-remote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Vendored gate matches its pin (offline)
        run: node scripts/verify-vendor.mjs
      - name: Vendored gate matches upstream at the pinned commit (remote)
        run: node scripts/verify-vendor.mjs --remote

  protocol-order:
    name: protocol-order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: The protocol-v1 tag exists and is respected
        run: node scripts/check-protocol-order.mjs --require-tag
      - name: Protocol tests in final mode
        run: PROTOCOL_FINAL=1 node --test tests/protocol.test.mjs

  spike-records:
    name: spike-records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Every spike record is present and final
        run: node scripts/check-spike-records.mjs --require-final

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Build the image and run the container smoke checks
        run: bash scripts/docker-smoke.sh --results "${RUNNER_TEMP}/docker-smoke-results.json"
      - name: Upload docker-smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-smoke-results
          path: ${{ runner.temp }}/docker-smoke-results.json
          if-no-files-found: warn
